[project]
name = "argo-iam-governance"
version = "0.1.0"
description = "IAM governance layer prototype for Argo CD (CS411 project)"
requires-python = ">=3.9"
dependencies = ["flask>=3.0,<4", "segno>=1.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
